<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Portal Omah Sinau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAE6BC; --cream-2:#F1D49A; --paper:#FFFBF0;
  --ink:#14301F; --ink-2:#4B5F51; --muted:#84958A; --line:#E8D6AC;
  --green:#1E8A4C; --green-d:#12663A; --green-50:#E1F2DA; --matcha:#BFE38A;
  --yellow:#FFD23F; --yellow-d:#C99A00; --yellow-50:#FFF1BF;
  --red:#E5484D; --red-d:#B4282D; --red-50:#FFE6E3;
  --blue:#3657D6; --blue-50:#E3E9FF;
  --orange:#FF8B3D; --orange-50:#FFE8D4;
  --pink:#EE5C9A; --pink-50:#FFE2EE;
  --purple:#7A4BD8; --purple-50:#EEE6FF;
  --r:20px; --r-sm:12px;
  --bd:2px solid var(--ink);
  --sh:4px 4px 0 var(--ink); --sh-sm:2px 2px 0 var(--ink);
  --font-h:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:800;line-height:1.15;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green-d);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:16px}
.grid>*,.row>.tabs{min-width:0}
.row>.row{min-width:0;max-width:100%}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g2{align-items:start}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--green);color:#fff;border:var(--bd);box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:5px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.wa{background:#25D366;color:var(--ink)}
.btn.red{background:var(--red)}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2);transition:background .12s}
.icon-btn:hover{background:var(--yellow-50);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:.2px}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:2px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:var(--ink);box-shadow:3px 3px 0 var(--yellow)}
textarea.input{min-height:90px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}
.ro{background:#FBF6E8!important}

/* ---------- cards ---------- */
.card{background:var(--paper);border-radius:var(--r);border:var(--bd);box-shadow:var(--sh);padding:18px}
.card h3{font-size:19px;margin-bottom:10px}
.card-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:18px;padding:15px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;border:var(--bd);box-shadow:3px 3px 0 var(--ink)}
.stat .lbl{font-size:12.5px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.stat .val{font-family:var(--font-h);font-size:28px;font-weight:800;line-height:1.05}
.stat .sub{font-size:12px;color:var(--ink-2)}
.bg-green{background:var(--green-50)} .bg-yellow{background:var(--yellow-50)} .bg-blue{background:var(--blue-50)} .bg-red{background:var(--red-50)} .bg-orange{background:var(--orange-50)} .bg-pink{background:var(--pink-50)} .bg-purple{background:var(--purple-50)} .bg-matcha{background:var(--matcha)} .bg-cream{background:var(--cream-2)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-50);color:var(--green-d)}
.b-red{background:var(--red-50);color:var(--red-d)}
.b-yellow{background:var(--yellow-50);color:#7A5C00}
.b-blue{background:var(--blue-50);color:#2440A8}
.b-pink{background:var(--pink-50);color:#B02A66}
.b-purple{background:var(--purple-50);color:#5B32B0}
.b-orange{background:var(--orange-50);color:#A24C0E}
.b-gray{background:#EFEBDF;color:var(--ink-2)}
.b-ink{background:var(--ink);color:var(--cream)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);font-weight:800;padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.t td{padding:10px;border-bottom:1.5px dashed var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.unpaid td{background:#FFF1EF}
.t tr.unpaid td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t .c{text-align:center}
.t .r{text-align:right}
.t input.input{padding:7px 9px;border-radius:10px}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:999px;border:var(--bd);box-shadow:var(--sh-sm);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 15px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:999px;font-weight:800;font-size:13px;background:var(--paper);border:2px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;position:relative;overflow:hidden;
  background-color:var(--yellow);background-image:radial-gradient(#F2BF1A 1.8px, transparent 1.9px);background-size:22px 22px}
.blob{position:absolute;border-radius:50%;border:var(--bd);z-index:0}
.login-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--paper);border-radius:28px;padding:26px 22px 22px;border:var(--bd);box-shadow:8px 8px 0 var(--ink);text-align:center}
.login-card .logo{width:136px;height:136px;margin:-6px auto 2px;display:block}
.login-card h1{font-size:28px}
.login-card .tabs{margin:16px 0 14px}
.login-card .tabs button{flex:1}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:14px;background:var(--yellow-50);border:2px dashed var(--yellow-d);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#5E4700}
.demo-box b{color:var(--ink)}
.sticker{display:inline-block;background:var(--matcha);border:var(--bd);border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;transform:rotate(-3deg);box-shadow:var(--sh-sm)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:#23874F;color:#FFF8E6;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.brand .lg{width:50px;height:50px;border-radius:14px;background:#fff;display:grid;place-items:center;flex-shrink:0;transform:rotate(-4deg);border:2px solid var(--yellow)}
.brand img{width:44px;height:44px}
.brand b{font-family:var(--font-h);font-size:19px;display:block;line-height:1.05;color:var(--yellow)}
.brand span{font-size:12px;color:#E0F2E5}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;font-weight:700;color:#F2FAF4;text-align:left;width:100%;border:2px solid transparent}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.14);color:#fff}
.nav-item.on{background:var(--yellow);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(250,230,188,.9);backdrop-filter:blur(8px)}
.topbar h2{font-size:24px}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.content{padding:6px 26px 48px;display:flex;flex-direction:column;gap:18px;max-width:1260px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:4px 5px 4px 14px;border:var(--bd);font-weight:800;font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:800;color:var(--ink);font-size:13px;flex-shrink:0;border:2px solid var(--ink)}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:var(--yellow);font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;opacity:.92}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:60;transform:translateX(-105%);transition:transform .22s}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(20,48,31,.4);z-index:55}
  .topbar{padding:12px 16px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:20px}
  .user-pill .nm{display:none}
  .content{padding:4px 16px 48px}
}

/* ---------- hero + tiles ---------- */
.hero{background:var(--yellow);border:var(--bd);box-shadow:var(--sh);border-radius:24px;padding:20px 22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .lg{width:86px;height:86px;border-radius:22px;background:#fff;border:var(--bd);display:grid;place-items:center;flex-shrink:0;transform:rotate(-5deg);position:relative;z-index:1}
.hero .lg img{width:76px;height:76px}
.hero h2{font-size:26px}
.hero p{color:var(--ink-2);font-weight:600}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;background:var(--matcha);border:var(--bd)}
.hero:before{content:"✦";position:absolute;right:150px;top:10px;font-size:26px;color:var(--ink);opacity:.85}
.hero > div{position:relative;z-index:1;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-align:center;border:var(--bd);box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tile svg{width:30px;height:30px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{padding:13px 6px;font-size:12.5px;line-height:1.25}.tile svg{width:25px;height:25px}.hero{padding:16px;gap:12px}.hero .lg{width:60px;height:60px;border-radius:16px}.hero .lg img{width:52px;height:52px}.hero h2{font-size:20px}.hero p{font-size:13.5px}.hero:before{display:none}.hero:after{width:110px;height:110px;right:-40px;bottom:-50px}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}

/* status segmented (absensi) */
.seg{display:inline-flex;background:#F3EBD6;border-radius:12px;padding:3px;gap:2px}
.seg button{min-width:38px;padding:6px 9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on.H{background:var(--green);color:#fff}
.seg button.on.I{background:var(--blue);color:#fff}
.seg button.on.S{background:var(--orange);color:#fff}
.seg button.on.A{background:var(--red);color:#fff}

/* jadwal */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.days{grid-template-columns:1fr}}
.day{border-radius:20px;padding:14px;background:var(--paper);border:var(--bd);box-shadow:3px 3px 0 var(--ink)}
.day h4{font-size:17px;padding:6px 12px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;border:2px solid var(--ink)}
.sess{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.sess:hover{border-color:var(--ink)}
.sess .time{font-weight:800;font-size:13px}

/* rekap grid */
.cell-ok{color:var(--green-d);font-weight:800}
.cell-no{color:var(--red-d);font-weight:800;background:var(--red-50)}
.cell-na{color:#CFC6AE}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,48,31,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.modal{background:var(--paper);border-radius:24px;width:100%;max-width:580px;border:var(--bd);box-shadow:8px 8px 0 var(--ink);animation:pop .18s ease-out}
.modal.wide{max-width:800px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--ink);background:var(--yellow);border-radius:22px 22px 0 0}
.modal-h h3{font-size:19px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:2px dashed var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;font-weight:800;z-index:200;border:2px solid var(--yellow);max-width:90vw;text-align:center}
.toast.err{background:var(--red);color:#fff;border-color:var(--ink)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,245,223,.55);z-index:150}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--cream-2);border-top-color:var(--green);border-right-color:var(--yellow);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- dokumen (slip, tagihan) ---------- */
.inv{font-family:var(--font-b);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:18px;padding:22px;position:relative;overflow:hidden}
.inv-h{display:flex;gap:12px;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:14px;margin-bottom:14px}
.inv-h img{width:64px;height:64px}
.inv-h h2{font-size:21px;color:var(--green-d)}
.inv table{width:100%;border-collapse:collapse;font-size:14px}
.inv td{padding:6px 0;vertical-align:top}
.inv .tot{font-family:var(--font-h);font-size:24px;color:var(--green-d)}
.inv table.lines{margin:10px 0;font-size:13px}
.inv table.lines th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);padding:6px 4px;border-bottom:2px solid var(--ink)}
.inv table.lines td{padding:6px 4px;border-bottom:1px dashed var(--line)}
.inv table.lines .r{text-align:right}
.stamp{position:absolute;right:18px;top:96px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:4px 12px;font-family:var(--font-h);font-weight:800;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--green);border-color:var(--green)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}

/* ---------- kuitansi (format Omah Sinau) ---------- */
.kw{position:relative;background:#fff;color:#2b2b2b;font-family:'Plus Jakarta Sans',Arial,sans-serif;border:1px solid #DADADA;overflow:hidden;padding:26px 34px 54px;min-height:400px;
  background-image:linear-gradient(135deg,rgba(0,0,0,.022) 25%,transparent 25%),linear-gradient(225deg,rgba(0,0,0,.022) 25%,transparent 25%);background-size:60px 60px}
.kw .bar{position:absolute;right:0;top:0;width:34px;height:110px;background:#57B45A}
.kw .foot{position:absolute;left:0;right:0;bottom:0;height:30px;background:#57B45A}
.kw-top{display:flex;align-items:flex-start;gap:16px}
.kw-top img{width:72px;height:72px;object-fit:cover}
.kw-title{flex:1;text-align:center}
.kw-title h1{font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:30px;font-weight:800;color:#3FA34D;letter-spacing:.3px}
.kw-title div{font-size:12px;color:#666}
.kw-org{width:160px;font-size:12px;color:#444;padding-right:30px;line-height:1.35}
.kw-rows{width:100%;margin:26px 0 22px;border-collapse:collapse;font-size:14.5px}
.kw-rows td{padding:7px 0;vertical-align:top}
.kw-rows td:first-child{width:150px;color:#555;font-size:13.5px}
.kw-bottom{display:flex;align-items:flex-end;gap:20px}
.kw-amt{flex:1;padding-left:60px}
.kw-amt span{display:block;font-size:13.5px;margin-bottom:6px;padding-left:12px}
.kw-amt .box{display:inline-block;border-top:2px solid #57B45A;border-bottom:2px solid #57B45A;padding:6px 14px;font-weight:800;font-size:16px;background:#F5F5F5}
.kw-sign{width:230px;text-align:center;font-size:13.5px}
.kw-sign .ttd{height:70px;display:grid;place-items:center;margin:2px 0}
.kw-sign .ttd img{max-height:70px;max-width:200px}
.kw .lunas{position:absolute;left:41%;bottom:64px;transform:rotate(-14deg);border:3px solid #3FA34D;color:#3FA34D;border-radius:10px;padding:2px 14px;font-weight:800;font-size:22px;letter-spacing:2px;opacity:.28}
@media(max-width:560px){.kw{padding:20px 16px 48px}.kw-org{display:none}.kw-top img{width:54px;height:54px}.kw-title h1{font-size:24px}.kw-amt{padding-left:0}.kw-bottom{flex-direction:column;align-items:stretch}.kw-sign{width:auto}.kw-rows td:first-child{width:110px}}

/* ---------- raport (format laporan belajar) ---------- */
.raport{background:#fff;color:#000;font-family:'Times New Roman',Tinos,'Liberation Serif',serif;font-size:15px;padding:26px 30px 30px;border:1px solid #DADADA;line-height:1.35}
.rp-head{display:flex;align-items:center;gap:10px}
.rp-head img{width:92px;height:92px;flex-shrink:0}
.rp-titles{flex:1;text-align:center;padding-right:60px}
.rp-titles .t1{font-size:19px;font-weight:700;letter-spacing:.2px}
.rp-titles .t2{font-size:18px}
.rp-titles .t3{font-size:13px;text-decoration:underline;margin-top:2px}
.rp-line{border-top:1.5px solid #000;border-bottom:.5px solid #000;height:4px;margin:6px 0 18px}
.rp-id{border-collapse:collapse;margin-bottom:16px}
.rp-id td{padding:3px 0;vertical-align:top}
.rp-id td:first-child{width:150px}
.rp-id td:nth-child(2){width:18px}
.rp-box{width:100%;border-collapse:collapse;margin-bottom:22px}
.rp-box th{text-align:left;font-weight:700;border:1px solid #000;padding:4px 6px}
.rp-box td{border:1px solid #000;padding:8px 8px 14px;min-height:60px;white-space:pre-line;vertical-align:top}
.rp-box td.empty-cell{height:70px}
.rp-date{text-align:right;padding-right:70px}
.rp-know{text-align:center;margin:2px 0 4px}
.rp-sign{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.rp-sign .ttd{height:96px;display:grid;place-items:center}
.rp-sign .ttd img{max-height:96px;max-width:210px}
@media(max-width:560px){.raport{padding:16px 12px;font-size:13.5px}.rp-head img{width:58px;height:58px}.rp-titles{padding-right:0}.rp-titles .t1{font-size:14.5px}.rp-titles .t2{font-size:14px}.rp-titles .t3{font-size:11px}.rp-id td:first-child{width:110px}.rp-date{padding-right:0}}

/* ---------- portal guru & ortu ---------- */
.kid-top{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:900px;margin:0 auto;width:100%}
.kid-top .lg{width:48px;height:48px;border-radius:14px;background:#fff;border:var(--bd);display:grid;place-items:center;transform:rotate(-4deg);flex-shrink:0}
.kid-top .lg img{width:42px;height:42px}
.kid-wrap .tabs{flex-wrap:wrap;border-radius:22px}
.kid-wrap .tabs button{flex:1 0 auto}
.kid-wrap{max-width:900px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:16px;width:100%}
.pay-alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pay-alert .ic{font-size:30px}
.fee-grid input{width:110px}
.reg-box{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);text-align:center;font-size:13.5px}
.reg-card{max-width:620px;text-align:left}
.reg-card .form-grid{margin-top:12px}
.info-box{background:var(--yellow-50);border:2px dashed var(--yellow-d);border-radius:14px;padding:12px 14px;line-height:1.6}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-day{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;min-height:110px;display:flex;flex-direction:column;gap:6px}
.wk-day.today{border-color:var(--ink);box-shadow:3px 3px 0 var(--yellow)}
.wk-h{font-size:12.5px;color:var(--ink-2)}
.wk-h b{font-family:var(--font-h);font-size:15px;color:var(--ink)}
.wk-empty{color:#CDBF9C;text-align:center;margin-top:16px}
.wk-cls{text-align:left;border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.3;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column}
.wk-cls b{font-family:var(--font-h);font-size:14px}
.wk-cls span{font-size:11.5px;color:var(--ink-2)}
.wk-cls.done{background:var(--green-50)}
.wk-cls.todo{background:var(--yellow)}
.wk-cls.future{background:#F6EFDD;border-color:var(--line);box-shadow:none;cursor:default}
.wk-cls.extra{background:var(--blue-50)}
@media(max-width:760px){.wk{grid-template-columns:1fr}.wk-day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.wk-h{width:64px}.wk-empty{margin:0}.wk-cls{flex:1 1 150px}}
.sw-row{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;background:#fff}
.sw-row.on{border-color:var(--green);background:#F6FCF3}
.sw-top{display:flex;gap:10px;align-items:center;cursor:pointer}
.sw-top input{width:22px;height:22px;accent-color:var(--green);flex-shrink:0}
.sw-note{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.sw-note textarea{min-height:58px;width:100%}
@media(max-width:560px){.sw-note{grid-template-columns:1fr}}
.ge-head{background:var(--yellow-50);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.ge-search{margin-top:10px}
#geRes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ses-item{border-bottom:1.5px dashed var(--line)}
.ses-item:last-child{border-bottom:0}
.ses-item .li{border-bottom:0}
.ses-item.open{background:#FFFDF4;margin:0 -18px;padding:0 18px 12px}
.ses-edit{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--paper)}
.bayar-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px dashed var(--yellow-d);background:var(--yellow-50);border-radius:14px;padding:12px;margin-top:12px}
.bayar-qr{display:flex;flex-direction:column;align-items:center;gap:2px}.bayar-qr img{width:130px;height:auto;background:#fff;border-radius:8px;padding:4px;border:1.5px solid var(--ink)}.bayar-qr span{font-size:11px;font-weight:800}
.qsearch{position:relative;flex:1;max-width:320px}.qsearch .input{padding:8px 12px}
.qres:empty{display:none}
.pick{position:relative}.pick .qres{top:calc(100% + 4px);max-height:300px;z-index:80}.pick .qres button.on{background:var(--green-50)}.pick .qres button.first{background:var(--yellow-50)}.input.warn{border-color:var(--red)}
.qres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:var(--sh-sm);z-index:60;max-height:360px;overflow:auto}
.qres button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:8px 12px;border:0;border-bottom:1px dashed var(--line);background:none;cursor:pointer;font:inherit}.qres button:hover{background:var(--yellow-50)}
@media (max-width:900px){.topbar{flex-wrap:wrap;row-gap:8px}.qsearch{order:10;flex:1 1 100%;max-width:none}.user-pill .nm{display:none}}
.t tfoot td{border-top:2px solid var(--ink);border-bottom:0}
.mat-ic{font-size:11px;font-weight:800;letter-spacing:.3px;background:var(--blue-50)}
.mat-map td,.mat-map th{padding:6px 8px}
.mat-li{align-items:flex-start}
.mat-li .meta b{white-space:normal}
.mat-act{display:flex;gap:4px;align-items:center;flex-shrink:0}
.mat-stats{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.mat-li{flex-wrap:wrap}.mat-act{width:100%;justify-content:flex-end;padding-left:52px}.mat-stats .stat{padding:12px}.mat-stats .stat .sub{display:none}.mat-stats .lbl{font-size:10.5px}}
.mat-n{min-width:34px;padding:3px 8px;border:2px solid var(--ink);border-radius:9px;background:var(--yellow);font-weight:800;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 var(--ink)}
.mat-n:hover{transform:translate(-1px,-1px)}
.bar-chart{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center}
.bar-pair i{display:block;width:40%;max-width:22px;border:1.5px solid var(--ink);border-radius:6px 6px 0 0}
.bar-col small{font-size:11px;color:var(--ink-2)}
.keu-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.keu-row:last-child{border-bottom:0}
.keu-row b{font-variant-numeric:tabular-nums}
.login-chip{display:inline-grid;grid-template-columns:auto auto;gap:1px 8px;background:var(--yellow-50);border:1.5px dashed var(--yellow-d);border-radius:10px;padding:4px 10px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.login-chip span{color:var(--ink-2)}
.login-chip b{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;letter-spacing:.5px}
.matrix th,.matrix td{white-space:nowrap}
.matrix td.gname{position:sticky;left:0;background:var(--paper);z-index:1;font-weight:800;box-shadow:2px 0 0 var(--line)}
.matrix input{width:96px}
.input.set{border-color:var(--green);background:var(--green-50);font-weight:800}
.sig-box{border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sig-box .pv{height:80px;width:100%;display:grid;place-items:center;background:#fff;border-radius:10px;border:1.5px solid var(--line)}
.sig-box .pv img{max-height:74px;max-width:95%}

  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) {
      res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    } else if (DEMO) {
      await new Promise(r => setTimeout(r, 120));
      res = Mock.handle(JSON.parse(JSON.stringify(req)));
    } else if (SUPA) {
      let r;
      try { r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.SUPABASE_FN}`, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, supaHeaders()), body: JSON.stringify(req) }); }
      catch (e) { throw new Error('Tidak bisa terhubung ke server. Cek koneksi internet.'); }
      const t = await r.text();
      try { res = JSON.parse(t); } catch (e) { res = { ok: false, error: r.status === 404 ? 'Server portal (Edge Function osin-api) belum dipasang.' : 'Server error ' + r.status }; }
      if (res && res.ok === undefined && (res.msg || res.message)) res = { ok: false, error: res.msg || res.message };
    } else {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req) });
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(res.message || res.error || 'Terjadi kesalahan');
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

/* angka → terbilang (untuk kuitansi) */
function terbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  const s = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  const f = x => x < 12 ? s[x]
    : x < 20 ? f(x - 10) + ' Belas'
    : x < 100 ? f(Math.floor(x / 10)) + ' Puluh' + (x % 10 ? ' ' + f(x % 10) : '')
    : x < 200 ? 'Seratus' + (x - 100 ? ' ' + f(x - 100) : '')
    : x < 1000 ? f(Math.floor(x / 100)) + ' Ratus' + (x % 100 ? ' ' + f(x % 100) : '')
    : x < 2000 ? 'Seribu' + (x - 1000 ? ' ' + f(x - 1000) : '')
    : x < 1e6 ? f(Math.floor(x / 1000)) + ' Ribu' + (x % 1000 ? ' ' + f(x % 1000) : '')
    : x < 1e9 ? f(Math.floor(x / 1e6)) + ' Juta' + (x % 1e6 ? ' ' + f(x % 1e6) : '')
    : f(Math.floor(x / 1e9)) + ' Miliar' + (x % 1e9 ? ' ' + f(x % 1e9) : '');
  return n === 0 ? 'Nol Rupiah' : (f(n) + ' Rupiah').replace(/\s+/g, ' ').trim();
}

/* slip dari data tersimpan (snapshot saat dibayar) — dipakai portal guru */
function gajiFromRec(rec) {

  const pokok = +rec.pokok || 0, transport = +rec.transport || 0, bonus = +rec.bonus || 0, pot = +rec.potongan || 0;

  </div></div>`;

async function doLogin(e) {
  e.preventDefault();
  const f = formData(e.target);
  try {
    const r = await call('login', { role: S.loginRole, user: f.user, pass: f.pass });
    S.token = r.token; S.role = r.role; S.profile = r.profile;
    store.set('osin_session', { token: r.token, role: r.role, profile: r.profile });
    await startApp();
  } catch (err) { toast(err.message, true); }
}
function logout(expired) {
  if (S.token && !expired) call('logout', {}, { silent: true }).catch(() => {});
  S.token = null; S.role = null; S.db = {}; S.me = null; S.g = null; S.page = null; S.tab = {}; S.f = {};
  store.del('osin_session'); closeModal();
  renderLogin();
  if (expired) toast('Sesi berakhir, silakan login kembali', true);
}
async function startApp() {
  if (S.role === 'admin') { if (!S.page) S.page = window.innerWidth <= 900 ? 'menu' : 'dashboard'; const r = await call('bootstrap'); S.db = r.data.db; S.settings = r.data.settings; S.level = r.data.level || 'owner'; S.users = r.data.users || []; renderAdmin(); }
  else if (S.role === 'guru') { const r = await call('guruData'); S.g = r.data; S.settings = r.data.settings; renderGuru(); }
  else { const r = await call('me'); S.me = r.data; S.settings = r.data.settings; renderOrtu(); }
  if (DEMO && !$('.mode-flag')) { const f = document.createElement('div'); f.className = 'mode-flag'; f.textContent = 'MODE DEMO'; document.body.appendChild(f); }
}
function urlParams() {
  return new Promise(ok => {
    try { if (IS_GAS && google.script.url) return google.script.url.getLocation(l => ok(l.parameter || {})); } catch (e) {}
    const o = {}; try { new URLSearchParams(location.search).forEach((v, k) => o[k] = v); } catch (e) {} ok(o);
  });
}
async function init() {
  try { const r = await call('publicSettings', {}, { silent: true }); S.settings = r.settings || {}; } catch (e) {}
  const q = await urlParams();
  if (q.tentor) return renderDataTentor(q.tentor);
  if (q.daftar === 'murid') return renderDaftarMurid();
  if (q.daftar === 'tentor') return renderDaftarTentor();
  const sess = store.get('osin_session');
  if (sess && sess.token) {
    Object.assign(S, { token: sess.token, role: sess.role, profile: sess.profile });
    try { await startApp(); return; } catch (e) { S.token = null; store.del('osin_session'); }
  }
  renderLogin();
}

}
/* pilih baris: jumlah anak masuk rentang (bila tidak ada → rentang terbesar di bawahnya), jenjang = rentang terkecil yang mencakup semua anak */
function pickRows(rows, info) {
  let c = rows.filter(r => { const g = anakRange(r.anak); return g && info.n >= g[0] && info.n <= g[1]; });
  if (!c.length) c = rows.filter(r => !anakRange(r.anak));
  if (!c.length) { const below = rows.filter(r => anakRange(r.anak) && anakRange(r.anak)[1] < info.n), mx = Math.max(-1, ...below.map(r => anakRange(r.anak)[1])); c = below.filter(r => anakRange(r.anak)[1] === mx); }
  const tryJ = set => { const ok = c.filter(r => { const rs = jjSet(r.jenjang); return !rs.size || [...set].every(x => rs.has(x)); }); if (!ok.length) return null; const sz = r => jjSet(r.jenjang).size || 99, m = Math.min(...ok.map(sz)); return ok.filter(r => sz(r) === m); };
  return tryJ(new Set(info.jj)) || tryJ(new Set(info.jj.map(x => x === 'TK' ? 'SD' : x === 'SMA' ? 'SMP' : x))) || tryJ(new Set([info.top])) || [];
}
/* cari fee; fee khusus tentor didahulukan. Durasi persis (mis. home visit 1,5 jam) = fee baris itu, selain itu fee 1 jam × durasi */
function findFee(info, dur, g) {
  const srcs = [g && g.id ? feeRows(g.id) : [], feeRows('')];
  for (const src of srcs) {
    for (const jenis of info.jenis === 'Home Visit' && info.n <= 1 ? ['Home Visit', 'Privat'] : [info.jenis]) {
      const c = pickRows(src.filter(r => r.jenis === jenis), info);
      if (!c.length) continue;
      const ex = c.find(r => Math.abs((+r.durasi || 1) - dur) < 0.01);
      if (ex) return { row: ex, mult: 1, exact: (+ex.durasi || 1) !== 1 };
      const one = c.find(r => (+r.durasi || 1) === 1) || c[0];
      return { row: one, mult: dur / (+one.durasi || 1) };
    }
  }
  return { row: null, mult: dur };
}

async function saveAktivasi(id) {

function groupSesiJAdm(rows) { const g = groupSesi(rows); g.forEach(x => { const r = rows.find(a => sesiKey(a) === x.key); x.jadwalId = r ? r.jadwalId || '' : ''; }); return g; }

function sppTagihan() {
  const p = S.f.sppP || thisPeriod(), flt = S.f.sppFilter || 'belum', st = S.settings;
  const all = siswaTagih().map(s => ({ s, e: billOf(s, p) })).filter(r => r.e.billed || r.e.paid);
  const unpaid = all.filter(r => isArrear(r.e)), lunas = all.filter(r => r.e.status === 'lunas');
  const akhirNanti = p === thisPeriod() && new Date().getDate() < (+st.tagihAkhirMulai || 25) ? siswaAktif().filter(s => waktuOf(s) === 'Akhir').length : 0;
  let rows = flt === 'belum' ? unpaid : flt === 'lunas' ? lunas : all;
  rows.sort((a, b) => (isArrear(b.e) - isArrear(a.e)) || a.s.nama.localeCompare(b.s.nama));
  const tot = sum(all, r => r.e.tag.nominal), masuk = sum(all, r => r.e.paid), sisa = sum(unpaid, r => r.e.sisa);

function sppRekap() {

  const list = siswaTagih().filter(s => months.some(m => { const e = billOf(s, m); return e.billed || e.paid; }));

      const e = billOf(s, m); paidTot += e.paid;
      if (m > cur || (!e.billed && !e.paid)) return `<td class="c cell-na">·</td>`;

  <div class="table-wrap"><table class="t"><thead><tr><th>Siswa</th>${months.map(m => `<th class="c">${BULAN[+m.slice(5) - 1].slice(0, 3)}</th>`).join('')}<th class="c">Tunggakan</th>${isOwner() ? '<th class="r">Jumlah</th>' : ''}</tr></thead><tbody>${body || '<tr><td colspan="15"><div class="empty">Belum ada data</div></td></tr>'}</tbody></table></div></div>`;
}
function csvSpp(y) {
  const months = Array.from({ length: 12 }, (_, i) => `${y}-${pad(i + 1)}`), cur = thisPeriod();
  const rows = [['ID', 'Nama', ...months.map(m => fmtPeriod(m)), 'Bulan Tunggakan', 'Total Tunggakan', 'Saldo Deposit']];

    let n = 0, t = 0;
    const c = months.map(m => { const e = billOf(s, m); if (m > cur || (!e.billed && !e.paid)) return '-'; if (e.status === 'lunas') return 'LUNAS ' + e.paid; if (e.status === 'deposit') return 'DEPOSIT ' + e.paid; n++; t += e.sisa; return (e.status === 'kurang' ? 'KURANG ' : 'BELUM ') + e.sisa; });

/* honor 1 sesi = fee tentor sesuai jenis kelas, jumlah & jenjang anak yang hadir, × durasi + transport (privat rumah) sekali per sesi */
function jadwalOfSesi(x, rows) {
  const jid = (rows.find(r => r.jadwalId) || {}).jadwalId;
  return D('Jadwal').find(j => j.id === jid) || jadwalOn(D('Jadwal'), x.tanggal).find(j => j.guruId === x.guruId && j.jamMulai === x.jam) || null;
}
function sesiHonor(g, x, rows) {

  });

  const lesIn = sum(spp.filter(isLes), x => x.nominal), biayaIn = sum(spp.filter(x => !isLes(x)), x => x.nominal);
  const lainIn = sum(keu.filter(x => x.tipe === 'Pemasukan'), x => x.nominal);
  const byKat = {}; keu.filter(x => x.tipe === 'Pengeluaran').forEach(x => byKat[x.kategori] = (byKat[x.kategori] || 0) + (+x.nominal || 0));
  const simp = {}; keu.filter(x => x.tipe === 'Simpanan').forEach(x => simp[x.kategori] = (simp[x.kategori] || 0) + (+x.nominal || 0));
  const gajiGuru = sum(gaji, x => x.total);
  const totalIn = lesIn + biayaIn + lainIn, totalOut = gajiGuru + sum(Object.values(byKat), v => v), simpNet = sum(Object.values(simp), v => v);
  return { m, spp, keu, gaji, lesIn, biayaIn, lainIn, byKat, simp, gajiGuru, nGaji: gaji.length, totalIn, totalOut, simpNet, net: totalIn - totalOut - simpNet };
}
function keuStart() {
  const st = S.settings.saldoAwalPeriode;
  if (/^\d{4}-\d{2}$/.test(st || '')) return st;
  const ms = D('SPP').map(x => String(x.tanggalBayar).slice(0, 7)).concat(D('Gaji').map(x => String(x.tanggalBayar).slice(0, 7)), D('Keuangan').map(x => String(x.tanggal).slice(0, 7))).filter(x => /^\d{4}-\d{2}$/.test(x)).sort();
  return ms[0] || thisPeriod();
}
function keuMonth(p) {
  const start = keuStart(); let kas = +S.settings.saldoAwalKas || 0; const simpTot = {};
  let m = start, k = null, guard = 0;
  if (p < start) { k = keuFlow(p); k.kasAwal = kas; k.kasAkhir = kas; k.simpTot = simpTot; return k; }
  while (m <= p && guard++ < 240) {
    k = keuFlow(m); k.kasAwal = kas; kas += k.net; k.kasAkhir = kas;
    Object.keys(k.simp).forEach(c => simpTot[c] = (simpTot[c] || 0) + k.simp[c]);
    m = addMonths(m, 1);
  }
  k.simpTot = Object.assign({}, simpTot); return k;
}

function shrinkImage(file, maxW = 420, maxH = 220, mono = false) {
  return new Promise((ok, ko) => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => {
      let w = im.width, h = im.height, sc = Math.min(1, maxW / w, maxH / h), out = '';
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; if (mono) x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        if (mono) { const d = x.getImageData(0, 0, c.width, c.height), a = d.data; for (let k = 0; k < a.length; k += 4) { const v = (a[k] * .3 + a[k + 1] * .59 + a[k + 2] * .11) > 140 ? 255 : 0; a[k] = a[k + 1] = a[k + 2] = v; a[k + 3] = 255; } x.putImageData(d, 0, 0); }
        out = c.toDataURL('image/png');
        if (out.length > 45000) { x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', .82); }
        if (out.length <= 45000) break; sc *= .8;
      }
      out.length <= 45000 ? ok(out) : ko(new Error('Gambar terlalu besar'));
    }; im.onerror = () => ko(new Error('File bukan gambar')); im.src = rd.result; };
    rd.onerror = () => ko(new Error('Gagal membaca file')); rd.readAsDataURL(file);
  });
}

begin;
delete from public.osin_rows;

insert into public.osin_rows (tbl, k, data)

    downloadFile(`Backup-OSIN-${tgl}.sql`, sql, 'application/sql');

function readB64(file) {

async function saveMateri(id) {

    const r = await call(matGuru() ? 'guruSaveMateri' : 'saveMateri', { row, file });

/* ---- kalender mingguan ---- */
function weekDates(off) {
  const d = new Date(); d.setHours(12); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(d); x.setDate(d.getDate() + i); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; });
}
function sesiOfJadwal(list, date, j) { return list.find(x => x.tanggal === date && (x.jadwalId === j.id || x.jam === j.jamMulai)); }
function gTabJadwal() {
  const off = +S.f.gWk || 0, days = weekDates(off), me = gMe(), today = todayStr();
  const ses = groupSesiJ(S.g.Absensi.filter(a => a.guruId === me && days.includes(a.tanggal)));
  const cal = days.map(d => {
    const js = jadwalOn(S.g.Jadwal, d).sort((a, b) => a.jamMulai.localeCompare(b.jamMulai));
    const used = [];
    const chips = js.map(j => {
      const x = sesiOfJadwal(ses, d, j); if (x) used.push(x.key);
      const st = x ? 'done' : d > today ? 'future' : 'todo';
      return `<button class="wk-cls ${st}" ${st === 'future' ? 'disabled' : ''} onclick="gOpenSesi('${d}','${j.id}','${esc(j.jamMulai)}')">
        <b>${esc(j.jamMulai)}</b> ${esc(j.tipe || '')}${j.mapel ? ' · ' + esc(j.mapel) : ''}<span>${x ? `✓ ${x.siswa.length} hadir` : st === 'future' ? `${swIdsOf(j).length} anak` : 'belum diisi'}${j.lokasi ? ' · ' + esc(j.lokasi) : ''}</span></button>`;
    }).join('');
    const extra = ses.filter(x => x.tanggal === d && !used.includes(x.key)).map(x => `<button class="wk-cls done extra" onclick="gOpenSesi('${d}','','${esc(x.jam)}')"><b>${esc(x.jam || '-')}</b> Sesi tambahan<span>✓ ${x.siswa.length} hadir</span></button>`).join('');
    return `<div class="wk-day ${d === today ? 'today' : ''}"><div class="wk-h"><b>${HARI[new Date(d + 'T12:00').getDay()].slice(0, 3)}</b> ${+d.slice(8)} ${BULAN[+d.slice(5, 7) - 1].slice(0, 3)}</div>${chips + extra || '<div class="wk-empty">—</div>'}</div>`;
  }).join('');
  const per = S.f.gsP || gajiNow();
  const bulan = groupSesiJ(S.g.Absensi.filter(a => a.guruId === me && inGaji(a.tanggal, per)));
  S._gSesi = bulan;
  return `<div class="card"><div class="card-head" style="align-items:center">
      <button class="icon-btn" onclick="S.f.gWk=${off - 1};renderGuru()" title="Minggu sebelumnya">‹</button>
      <h3 style="margin:0">${fmtDate(days[0])} – ${fmtDate(days[6])}</h3>
      <button class="icon-btn" onclick="S.f.gWk=${off + 1};renderGuru()" title="Minggu berikutnya">›</button>
      ${off ? `<button class="chip" onclick="S.f.gWk=0;renderGuru()">Minggu ini</button>` : ''}
      <div class="spacer"></div><button class="btn sm yellow" onclick="gOpenSesi(todayStr(),'','')">${ic('plus')} Sesi tambahan</button></div>
    <p class="small muted" style="margin-bottom:10px">Klik kelas → centang siswa yang hadir → isi perkembangan singkat → Simpan. <span class="badge b-green">hijau</span> sudah diisi · <span class="badge b-yellow">kuning</span> belum diisi.</p>
    <div class="wk">${cal}</div></div>
  <div class="card"><div class="card-head"><h3>Sesi saya</h3><select class="input" style="max-width:340px;min-width:0" onchange="S.f.gsP=this.value;S.f.gInline='';renderGuru()">${gajiOptions(per, 3, 0)}</select><div class="spacer"></div><span class="badge b-ink">${bulan.length} sesi</span></div>
    ${bulan.map((x, i) => { const notes = S.g.Perkembangan.filter(p => p.guruId === me && p.tanggal === x.tanggal && x.siswa.includes(p.siswaId)).length; const open = S.f.gInline === x.key; return `<div class="ses-item ${open ? 'open' : ''}"><div class="li"><div class="avatar" style="background:var(--yellow-50)">${+x.tanggal.slice(8)}</div><div class="meta"><b>${dayName(x.tanggal)}, ${fmtDate(x.tanggal)} · ${esc(x.jam || '-')}</b><span class="small muted">${x.siswa.map(id => esc(gSw(id).panggilan || gSw(id).nama)).join(', ')}${notes ? ` · 📝 ${notes} catatan` : ''}</span></div><span class="badge b-green">${x.siswa.length}</span><button class="btn sm ${open ? 'dark' : 'ghost'}" onclick="gInline(${i})">${open ? 'Tutup' : 'Edit'}</button></div>${open ? `<div class="ses-edit" id="geBox"></div>` : ''}</div>`; }).join('') || '<div class="empty">Belum ada sesi di periode ini</div>'}</div>`;
}

function gOpenSesi(date, jid, jam) {

function geInit(date, jid, jam) {
  const me = gMe(), j = S.g.Jadwal.find(x => x.id === jid);

  if (!j && exist[0] && exist[0].jadwalId) jid = exist[0].jadwalId;
  const ids = exist.length ? exist.map(a => a.siswaId) : swIdsOf(j);
  const notes = {};
  S.g.Perkembangan.filter(p => p.guruId === me && p.tanggal === date).forEach(p => notes[p.siswaId] = { materi: '', deskripsi: [p.materi, p.deskripsi].filter(Boolean).join(' — ') });
  const dur = exist.length ? durasiOf(exist[0]) : (durJadwal(j) || 1);
  S.ge = { date, jam: jam || '', jid: jid || '', dur, origDate: exist.length ? date : '', origJam: exist.length ? jam : '', exist: exist.length > 0, set: Object.fromEntries(ids.map(i => [i, 1])), notes, extra: ids.filter(i => !swIdsOf(j).includes(i)) };
}

function geHtml() {
  const e = S.ge, j = S.g.Jadwal.find(x => x.id === e.jid);

  const ids = [...new Set(base.concat(e.extra, Object.keys(e.set)))];

async function geSave() {

    S.g.Absensi = S.g.Absensi.filter(a => !keys.includes(sesiKey(a))).concat(r.rows);
    S.g.Perkembangan = S.g.Perkembangan.filter(p => !(p.guruId === me && p.tanggal === e.date && ids.includes(p.siswaId))).concat(r.perkembangan || []);

}

function billablePeriods(s, upto = thisPeriod(), max = 12) {
  const start = (s.tglMulai || upto).slice(0, 7);
  const out = []; let p = upto;
  for (let i = 0; i < max; i++) { if (p < start) break; if (periodBillable(s.waktuBayar || 'Awal', p, S.settings)) out.unshift(p); p = addMonths(p, -1); }
  return out;
}

  } else if (t === 'harian') {
    const lb = rps.filter(r => !isSem(r));
    body = `<div class="card"><h3>Laporan bulanan</h3><p class="small muted" style="margin:-4px 0 8px">Catatan sesi belajar dari guru, dikirim oleh akademik setiap bulan.</p>${lb.map(r => `<div class="li"><div class="avatar" style="background:var(--purple-50)">📝</div><div class="meta"><b>${fmtPeriod(r.periode)}</b><span class="small muted">${esc(r.hadir || 0)} pertemuan · ${harian.filter(h => h.tanggal.startsWith(r.periode)).length} catatan</span></div><button class="btn sm" onclick="ortuLaporan('${r.id}')">Lihat</button></div>`).join('') || '<div class="empty">Belum ada laporan bulanan</div>'}</div>`;
  } else if (t === 'akun') {
    body = akunCard('Kode akses', 4);
  } else {
    body = `<div class="card"><h3>Rapot</h3><p class="small muted" style="margin:-4px 0 8px">Rapot perkembangan belajar, terbit 6 bulan sekali.</p>${rps.filter(isSem).map(r => `<div class="li"><div class="avatar" style="background:var(--orange-50)">📄</div><div class="meta"><b>${periodeLabel(r)}</b><span class="small muted">${esc(r.paket || '')}${r.pertemuan ? ` · hadir ${esc(r.hadir)}/${esc(r.pertemuan)}` : +r.hadir ? ` · hadir ${esc(r.hadir)} sesi` : ''}</span></div><button class="btn sm" onclick="ortuRaport('${r.id}')">Lihat / Cetak</button></div>`).join('') || '<div class="empty">Belum ada rapot</div>'}</div>`;
  }
  $('#app').innerHTML = kidTop('Portal Orang Tua') + `<div class="kid-wrap">
    <div class="hero"><div class="avatar" style="width:64px;height:64px;font-size:22px;position:relative;z-index:1;transform:rotate(-4deg);background:#fff">${initials(s.nama)}</div><div><h2>${esc(s.nama)}</h2><p>${esc(s.id)} · ${esc(kelasLabel(s))} · ${stBadge(s.status)}</p></div></div>
    ${tabBar('ortu', [['ringkas', 'Ringkasan'], ['absen', 'Kehadiran'], ['harian', 'Laporan Bulanan'], ['raport', 'Rapot'], ['bayar', `Pembayaran${unpaid.length || lainBelum.length ? ' 🔴' : ''}`], ['akun', 'Akun']], t, 'renderOrtu')}
    ${body}
  </div>`;
}
function ortuWaBayar(per) {
  const s = S.me.siswa;
  openWa(waAdminOf(S.settings), `Assalamu'alaikum admin ${S.settings.namaLembaga}, saya orang tua ${s.nama} (${s.id}) ingin konfirmasi pembayaran les${per ? ' bulan ' + fmtPeriod(per) : ''}. Berikut bukti pembayarannya:`);
}
function ortuLedger() {
  const s = S.me.siswa;
  return ledgerSiswa(s, { pk: { satuan: s.paketSatuan || 'Per bulan', harga: s.paketHarga || s.tagihan || 0, waktuBayar: s.waktuBayar || 'Awal' }, tp: { harga: s.transportHarga || 0 }, abs: S.me.Absensi, spp: S.me.SPP, st: S.settings });
}
function ortuDoc(per) {
  const s = S.me.siswa, e = (S._olg || ortuLedger()).periods[per];
  if (e && (e.status === 'belum' || e.status === 'kurang')) {
    modal('Tagihan Les', tagihanHtml(s, per, e, S.settings), `<button class="btn ghost" onclick="printModal('.inv','Tagihan ${fmtPeriod(per)}')">${ic('print')} Cetak / PDF</button><button class="btn wa" onclick="ortuWaBayar('${per}')">${ic('wa')} Kirim Bukti Bayar</button>`, true);
    return;
  }
  const x = e && e.rows[e.rows.length - 1];
  if (x) { modal('Kuitansi Pembayaran', kuitansiHtml(s, x, S.settings), `<button class="btn ghost" onclick="printModal('.kw','Kuitansi ${fmtPeriod(per)}')">${ic('print')} Cetak / PDF</button>${imgBtn('', 'Kuitansi ' + s.nama + ' ' + x.noKuitansi).replace('Kirim gambar', 'Simpan gambar')}`, true); prepDocImage('.kw', 'Kuitansi ' + s.nama + ' ' + x.noKuitansi); }
  else modal('Tagihan Les', tagihanHtml(s, per, +s.tagihan || 0, S.settings), `<button class="btn ghost" onclick="printModal('.inv','Tagihan ${fmtPeriod(per)}')">${ic('print')} Cetak / PDF</button><button class="btn wa" onclick="ortuWaBayar('${per}')">${ic('wa')} Kirim Bukti Bayar</button>`, true);
}
function ortuDocRow(id) {
  const x = S.me.SPP.find(v => v.id === id);
  modal('Kuitansi Pembayaran', kuitansiHtml(S.me.siswa, x, S.settings), `<button class="btn ghost" onclick="printModal('.kw','Kuitansi')">${ic('print')} Cetak / PDF</button>${imgBtn('', 'Kuitansi ' + x.noKuitansi).replace('Kirim gambar', 'Simpan gambar')}`, true);
  prepDocImage('.kw', 'Kuitansi ' + S.me.siswa.nama + ' ' + x.noKuitansi);
}
function ortuLaporan(id) {
  const r = S.me.Raport.find(x => x.id === id), s = S.me.siswa;
  const notes = (S.me.Perkembangan || []).filter(h => h.tanggal.startsWith(r.periode)).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  modal(`Laporan ${fmtPeriod(r.periode)}`, laporanHtml(s, r, notes, r.hadir, S.settings, n => n.guruNama || ''), `<button class="btn ghost" onclick="printModal('.raport','Laporan ${esc(s.nama)} ${fmtPeriod(r.periode)}')">${ic('print')} Cetak / PDF</button>${imgBtn('', 'Laporan ' + s.nama).replace('Kirim gambar', 'Simpan gambar')}`, true);
  prepDocImage('.raport', 'Laporan ' + s.nama + ' ' + r.periode);
}
function ortuRaport(id) {
  const r = S.me.Raport.find(x => x.id === id), s = S.me.siswa;
  modal(`Rapot ${periodeLabel(r)}`, raportHtml(s, r, S.settings), `<button class="btn" onclick="printModal('.raport','Raport ${esc(s.nama)} ${fmtPeriod(r.periode)}')">${ic('print')} Cetak / Simpan PDF</button>`, true);
}

/* =========================================================
   PENDAFTARAN (tanpa login): murid baru, calon tentor, data tutor baru
   ========================================================= */
function regShell(title, sub, inner) {
  $('#app').innerHTML = `<div class="login-wrap"><div class="blob" style="width:240px;height:240px;background:var(--matcha);left:-90px;top:-80px"></div><div class="blob" style="width:300px;height:300px;background:var(--green);right:-130px;bottom:-130px"></div>
    <div class="login-card reg-card"><div class="row" style="justify-content:center;gap:12px;margin-bottom:6px"><img src="${LOGO}" alt="" style="width:74px;height:74px"><div style="text-align:left"><h1 style="font-size:23px">${title}</h1><p class="small muted">${sub}</p></div></div>${inner}
    <div style="text-align:center;margin-top:14px"><button class="btn sm ghost" onclick="clearUrl();renderLogin()">← Kembali ke halaman login</button></div></div></div>`;
}
function clearUrl() { try { if (!IS_GAS && location.search) history.replaceState(null, '', location.pathname); } catch (e) {} }
const fld = (name, label, opt = {}) => `<div class="field ${opt.full ? 'full' : ''}"><label>${label}${opt.req ? ' *' : ''}</label>${opt.select ? `<select class="input" name="${name}" ${opt.req ? 'required' : ''}><option value="">— pilih —</option>${opt.select.map(o => `<option>${esc(o)}</option>`).join('')}</select>` : opt.area ? `<textarea class="input" name="${name}" ${opt.req ? 'required' : ''} placeholder="${esc(opt.ph || '')}">${esc(opt.val || '')}</textarea>` : `<input class="input" name="${name}" ${opt.req ? 'required' : ''} ${opt.tel ? 'inputmode="tel"' : ''} placeholder="${esc(opt.ph || '')}" value="${esc(opt.val || '')}">`}</div>`;
function renderDaftarMurid() {
  const st = S.settings || {};
  regShell('Pendaftaran Murid Baru', `${esc(st.namaLembaga || 'Omah Sinau')} · Tahun Ajar ${esc(st.tahunAjaran || '')}`, `
    <div class="info-box small">Dengan mendaftar, saya bersedia mengikuti les dengan disiplin & memenuhi kewajiban.</div>
    <form id="fReg" class="form-grid" onsubmit="event.preventDefault();kirimDaftarMurid()">
      ${fld('nama', 'Nama lengkap murid', { req: 1, full: 1 })}${fld('ortu', 'Nama orang tua', { req: 1 })}
      ${fld('paket', 'Paket belajar', { req: 1, select: PAKET_FORM })}${fld('kelas', 'Kelas', { req: 1, select: KELAS_FORM })}
      ${fld('sekolah', 'Sekolah', { req: 1, ph: 'contoh: SDN 2 Sukomulyo' })}${fld('tempatLes', 'Tempat les', { req: 1, select: listOf('lokasiList') })}
      ${fld('jadwal', 'Jadwal les yang diinginkan', { req: 1, ph: 'contoh: Rabu & Kamis 17.00' })}
      ${fld('alamat', 'Alamat rumah', { req: 1, full: 1 })}
      <div class="field full"><label>Lokasi rumah (Google Maps)</label><div class="row" style="flex-wrap:nowrap;gap:6px"><input class="input" name="mapsUrl" id="regMaps" inputmode="url" placeholder="tempel link lokasi, atau klik tombol →" style="flex:1"><button type="button" class="btn sm ghost" onclick="ambilLokasi()">📍 Lokasi saya</button></div><span class="hint">Opsional — memudahkan tentor home visit / privat rumah.</span></div>
      ${fld('waOrtu', 'No. WhatsApp orang tua', { req: 1, tel: 1, ph: '08…' })}${fld('waSiswa', 'No. WhatsApp murid (opsional)', { tel: 1, ph: 'untuk pengingat jadwal' })}
      <input type="text" name="website" class="hidden" tabindex="-1" autocomplete="off">
      <div class="full"><button class="btn block yellow" style="padding:13px">Kirim Pendaftaran →</button></div>
    </form>`);
}
function ambilLokasi() {
  if (!navigator.geolocation) return toast('HP tidak mendukung lokasi — tempel link dari Google Maps', true);
  toast('Mengambil lokasi…');
  navigator.geolocation.getCurrentPosition(p => { $('#regMaps').value = `https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`; toast('Lokasi terisi ✓'); },
    () => toast('Izin lokasi ditolak — tempel link dari Google Maps', true), { enableHighAccuracy: true, timeout: 15000 });
}
async function kirimDaftarMurid() {
  const d = formData($('#fReg'));
  try { const r = await call('daftarMurid', { data: d }); clearUrl(); S._regMsg = `Assalamu'alaikum admin, saya sudah mendaftarkan ${d.nama} (no. ${r.id}) di ${S.settings.namaLembaga || 'Omah Sinau'}.`;
    regShell('Pendaftaran terkirim! 🎉', esc(S.settings.namaLembaga || ''), `<div class="info-box" style="text-align:center"><p>Terima kasih, data <b>${esc(d.nama)}</b> sudah kami terima.<br>No. pendaftaran: <b>${esc(r.id)}</b></p><p class="small" style="margin-top:8px">Admin akan menghubungi WhatsApp orang tua untuk konfirmasi jadwal & mengirim akses Portal Orang Tua.</p></div>
      <div style="text-align:center;margin-top:12px"><button class="btn wa" onclick="openWa(S.settings.noWa,S._regMsg)">${ic('wa')} Chat Admin</button></div>`);
  } catch (e) { toast(e.message, true); }
}
function renderDaftarTentor() {
  regShell('Pendaftaran Tentor', `Bergabung mengajar di ${esc((S.settings || {}).namaLembaga || 'Omah Sinau')}`, `
    <div class="info-box small">Isi data dengan lengkap. Berkas akan direview owner; bila lolos, kamu akan dihubungi lewat WhatsApp untuk jadwal interview.</div>
    <form id="fRegT" class="form-grid" onsubmit="event.preventDefault();kirimDaftarTentor()">
      ${fld('nama', 'Nama lengkap', { req: 1, full: 1 })}${fld('wa', 'No. WhatsApp', { req: 1, tel: 1 })}${fld('email', 'Email')}
      ${fld('pendidikan', 'Pendidikan sedang/terakhir', { full: 1, ph: 'contoh: S1 Pendidikan Matematika' })}
      ${fld('alamat', 'Alamat rumah', { full: 1 })}
      ${fld('mapel', 'Mapel / jenjang yang bisa diajar', { full: 1, ph: 'contoh: Calistung, Matematika SD–SMP' })}
      ${fld('pengalaman', 'Pengalaman mengajar', { full: 1, area: 1 })}
      ${fld('ketersediaan', 'Hari & jam bisa mengajar', { full: 1, ph: 'contoh: Senin–Jumat 14.00–19.00' })}
      ${fld('motivasi', 'Kenapa ingin bergabung?', { full: 1, area: 1 })}
      <input type="text" name="website" class="hidden" tabindex="-1" autocomplete="off">
      <div class="full"><button class="btn block yellow" style="padding:13px">Kirim Pendaftaran →</button></div>
    </form>`);
}
async function kirimDaftarTentor() {
  const d = formData($('#fRegT'));
  try { await call('daftarTentor', { data: d }); clearUrl();
    regShell('Terima kasih! 🙌', 'Pendaftaran tentor terkirim', `<div class="info-box" style="text-align:center"><p>Data <b>${esc(d.nama)}</b> sudah kami terima.</p><p class="small" style="margin-top:8px">Owner akan mereview berkas dan menghubungi WhatsApp kamu untuk informasi interview.</p></div>`);
  } catch (e) { toast(e.message, true); }
}
async function renderDataTentor(token) {
  S.tentorToken = token;
  let info;
  try { info = (await call('dataTentorInfo', { token2: token })).info; } catch (e) { regShell('Link tidak valid', '', `<div class="info-box" style="text-align:center">${esc(e.message)}</div>`); return; }
  if (info.done) return regShell('Data sudah terkirim ✓', '', `<div class="info-box" style="text-align:center">Data tutor <b>${esc(info.nama)}</b> sudah tercatat dengan ID <b>${esc(info.guruId)}</b>. Silakan login di Portal Guru.</div>`);
  regShell('Data Tutor Baru', 'Selamat, kamu diterima! Lengkapi data berikut.', `
    <form id="fDT" class="form-grid" onsubmit="event.preventDefault();kirimDataTentor()">
      ${fld('nama', 'Nama lengkap', { req: 1, full: 1, val: info.nama })}${fld('wa', 'No. WhatsApp', { req: 1, tel: 1, val: info.wa })}
      ${fld('pendidikan', 'Pendidikan sedang/terakhir', { val: info.pendidikan, ph: 'contoh: S1 Pendidikan Matematika' })}
      ${fld('alamat', 'Alamat rumah lengkap', { full: 1, val: info.alamat })}
      ${fld('jenjangAjar', 'Jenjang & mapel yang disanggupi', { req: 1, full: 1, val: info.jenjangAjar, ph: 'contoh: calistung, SD, SMP matematika' })}
      ${fld('hariAjar', 'Hari mengajar yang disanggupi', { req: 1, full: 1, val: info.hariAjar, ph: 'contoh: setiap hari kecuali Minggu' })}
      ${fld('shift', 'Jam ketersediaan / shift', { req: 1, ph: 'contoh: 13.00–20.00' })}${fld('maksSesi', 'Batas sesi mengajar per hari', { req: 1, select: ['2', '3', '4', '5', '6', '7'] })}
      <div class="field full"><label>Area penempatan mengajar *</label><div class="row" style="gap:6px 14px">${listOf('lokasiList').map(l => `<label class="row small" style="gap:6px;font-weight:600"><input type="checkbox" name="areaPick" value="${esc(l)}"> ${esc(l)}</label>`).join('')}</div></div>
      ${fld('metodeBayar', 'Pilihan akun pembayaran gaji', { req: 1, select: METODE_GAJI })}
      ${fld('noRekening', 'No. rekening / No. HP akun DANA', { req: 1 })}${fld('atasNama', 'Atas nama', { req: 1, full: 1 })}
      <label class="full row small" style="gap:8px;align-items:flex-start;font-weight:600;flex-wrap:nowrap;cursor:pointer"><input type="checkbox" name="kontrak" value="1" required style="margin-top:3px"> Saya sudah membaca kontrak dan bersedia mengikuti arahan dari Bimbel Omah Sinau, serta melaksanakan tugas tutor dengan penuh tanggung jawab.</label>
      <div class="full"><button class="btn block yellow" style="padding:13px">Kirim Data →</button></div>
    </form>`);
}
async function kirimDataTentor() {
  const d = formData($('#fDT'));
  d.area = $$('#fDT input[name=areaPick]:checked').map(x => x.value).join(', '); delete d.areaPick;
  if (!d.area) return toast('Pilih minimal satu area penempatan', true);
  try { const r = await call('dataTentorSubmit', { token2: S.tentorToken, data: d }); clearUrl();
    regShell('Selamat bergabung! 🎉', esc(S.settings.namaLembaga || ''), `<div class="info-box" style="text-align:center"><p>Akun Portal Guru kamu:</p><p style="margin:8px 0">${`<span class="login-chip" style="font-size:15px"><span>ID</span><b>${esc(r.guru.id)}</b><span>PIN</span><b>${esc(r.guru.pin)}</b></span>`}</p><p class="small">Simpan ID & PIN ini. Kamu bisa mengganti PIN di menu Akun setelah login.</p></div>
      <div style="text-align:center;margin-top:12px"><button class="btn" onclick="S.loginRole='guru';renderLogin('guru')">Login Portal Guru →</button></div>`);
  } catch (e) { toast(e.message, true); }
}

init();
</script>
